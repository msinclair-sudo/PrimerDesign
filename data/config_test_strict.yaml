# Strict, fast config for the bundled rodent test data set.
# Tight thresholds and a single sliding window keep DECIPHER work small
# while still producing a handful of viable primer pairs for the report.

header:
  main: "Primers for"
  coloured: "Mus musculus"
  last: " * Test run (strict config)"
  subtitle: "Strict-config smoke test"

design:
  min_primer_length: 19
  max_primer_length: 23
  min_amplicon_length: 100
  max_amplicon_length: 180

decipher:
  min_coverage: 1.0       # primer must bind every MSA sequence
  resolution: 5
  max_permutations: 1     # no degenerate bases
  num_primer_sets: 20
  search_primers: 21      # must be > num_primer_sets
  window_size: 5500       # single window over the ~5 kb test alignment
  window_overlap: 0

thermodynamics:
  tm_range:
    value: [58, 62]       # narrow Tm window
    action: reject
  max_delta_tm:
    value: 2
    action: reject
  gc_range:
    value: [45, 55]
    action: reject
  max_hairpin_dg:
    value: -2.0
    action: reject
  max_homodimer_dg:
    value: -6.0
    action: reject
  max_heterodimer_dg:
    value: -6.0
    action: reject
  max_homopolymer:
    value: 3
    action: reject
  gc_clamp_3prime:
    value: [2, 3]
    action: reject

mismatches:
  on_target: 1            # strict: near-perfect binding only
  off_target: 2

ecopcr:
  min_amplicon_length: 10
  max_amplicon_length: 500
  circular: true
