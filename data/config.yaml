# Primer design constraints
design:
  min_primer_length: 18
  max_primer_length: 25
  min_amplicon_length: 90
  max_amplicon_length: 180
  optimal_amplicon_length: 130

# Thermodynamic thresholds
thermodynamics:
  tm_range: [58, 64]
  max_delta_tm: 5
  gc_range: [40, 60]
  max_hairpin_dg: -3.0
  max_homodimer_dg: -9.0
  max_heterodimer_dg: -9.0
  max_homopolymer: 4
  gc_clamp_3prime: [1, 3]

# Binding analysis
binding:
  max_mismatches: 3
  max_amplicon_distance: 500

# Off-target (ecoPCR)
ecopcr:
  max_mismatches: 3
  min_amplicon_length: 50
  max_amplicon_length: 500
  circular: true

# Ranking weights
ranking:
  binding_universality: 0.25
  thermodynamic_quality: 0.20
  species_resolution: 0.20
  off_target_specificity: 0.20
  amplicon_suitability: 0.15

# DECIPHER-specific (if using Option A)
decipher:
  min_coverage: 0.8
  resolution: 5
  max_degeneracy: 128
